name: devicescope
description: Offline Android device diagnostic toolkit.
publish_to: 'none'
version: 0.1.0+3

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  device_info_plus: ^12.4.0
  battery_plus: ^7.1.2
  connectivity_plus: 7.3.1
  network_info_plus: 7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
